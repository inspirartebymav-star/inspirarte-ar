<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>INSPIRARTE AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#ar-container{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

a-scene{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  margin:0!important;
  padding:0!important;
}

.a-canvas{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
}

#start-screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:18px;
  padding:30px;
  box-sizing:border-box;
  background:#050505;
  color:white;
  text-align:center;
  font-family:Arial,sans-serif;
}

#start-screen h1{
  margin:0;
  font-size:30px;
}

#start-screen p{
  margin:0;
  max-width:320px;
  line-height:1.5;
  font-size:16px;
}

#start-button,
#sound-button{
  border:0;
  border-radius:999px;
  padding:14px 24px;
  font-size:16px;
  font-weight:bold;
}

#status{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:none;
  background:rgba(0,0,0,.72);
  color:white;
  padding:10px 17px;
  border-radius:999px;
  font-family:Arial,sans-serif;
  font-size:15px;
  white-space:nowrap;
}

#sound-button{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:11;
  display:none;
}
</style>
</head>

<body>

<div id="ar-container">

<div id="start-screen">
<h1>INSPIRARTE ✨</h1>

<p>
Apunta la cámara hacia tu imagen para descubrir tu momento mágico.
</p>

<button id="start-button">
✨ Comenzar experiencia
</button>
</div>

<div id="status">
Apunta al marcador 📷
</div>

<button id="sound-button">
🔊 Activar sonido
</button>


<a-scene
id="ar-scene"

mindar-image="
imageTargetSrc: ./targets.mind;
autoStart: false;
uiLoading: no;
uiScanning: no;
uiError: no;
"

embedded

color-space="sRGB"

renderer="
colorManagement: true;
physicallyCorrectLights;
alpha: true
"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false"

loading-screen="enabled: false"
>


<a-assets>

<video
id="ar-video"
src="./video.mp4"
preload="auto"
loop
playsinline
webkit-playsinline
crossorigin="anonymous"
muted>
</video>

</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>


<a-entity
id="ar-target"
mindar-image-target="targetIndex: 0"
>

<a-video
id="ar-video-plane"
src="#ar-video"
position="0 0 0.01"
rotation="0 0 0"
width="1"
height="0.5625"
material="shader: flat; transparent: true">
</a-video>

</a-entity>

</a-scene>

</div>


<script>

document.addEventListener("DOMContentLoaded",function(){

const scene =
document.querySelector("#ar-scene");

const arSystem =
scene.systems["mindar-image-system"];

const start =
document.querySelector("#start-screen");

const startBtn =
document.querySelector("#start-button");

const status =
document.querySelector("#status");

const sound =
document.querySelector("#sound-button");

const target =
document.querySelector("#ar-target");

const video =
document.querySelector("#ar-video");


startBtn.addEventListener("click",async function(){

start.style.display="none";

status.style.display="block";

status.textContent="Apunta al marcador 📷";

try{

await arSystem.start();

}catch(e){

console.error(e);

status.textContent="No se pudo iniciar la cámara";

}

});


target.addEventListener(
"targetFound",
async function(){

status.textContent=
"✨ ¡Momento mágico encontrado!";

try{

await video.play();

}catch(e){

sound.style.display="block";

}

});


target.addEventListener(
"targetLost",
function(){

status.textContent=
"Apunta al marcador 📷";

video.pause();

});


sound.addEventListener(
"click",
async function(){

try{

video.muted=false;

await video.play();

sound.style.display="none";

}catch(e){

console.error(e);

}

});

});

</script>

</body>
</html>
